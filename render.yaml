services:
  - type: web
    name: coinleads
    runtime: python
    plan: free             # Render free plan; kept awake by UptimeRobot pinging /healthz
    buildCommand: echo "no dependencies"
    startCommand: python scraper.py
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: .
      - key: DASH_PASSWORD
        sync: false        # Render asks you for this value on first deploy (or set in Environment settings)
      - key: MIN_MCAP_USD
        value: "15000"
      - key: MAX_MCAP_USD
        value: "250000"
      - key: BOND_MCAP_USD
        value: "43000"     # Calibrated for current SOL price (~$102) pump.fun bonding
      - key: INTERVAL
        value: "180"       # 3 minutes scan interval
      - key: PYTHON_VERSION
        value: 3.12.4
